search-path = [".", "backend"]
project-excludes = ["**/.git", "**/__pycache__", "staticfiles", "media"]

[errors]
# Django ORM tự sinh động các thuộc tính qua metaclass (objects, get_*_display, related_name, *_id)
missing-attribute = false
# Django không đi kèm type stubs (py.typed) mặc định
untyped-import = false
